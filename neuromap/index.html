<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlkimiaTech Neuromap 3D</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #0b0a1a;
        font-family: "Segoe UI", sans-serif;
      }
      #info {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #ffaa55;
        font-size: 1.2rem;
        z-index: 10;
      }
      #info h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      #info p {
        margin: 4px 0;
        color: #ccc;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <h1>AlkimiaTech Neuromap 3D</h1>
      <p>Live brain visualization for neurological monitoring</p>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      // ==================== SCENE ====================
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0a1a);

      // ==================== CAMERA ====================
      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 0, 5);

      // ==================== RENDERER ====================
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      // ==================== CONTROLS ====================
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.0;

      // ==================== LIGHTS ====================
      const ambientLight = new THREE.AmbientLight(0x404060);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0xffaa55, 1.5, 20);
      pointLight.position.set(3, 3, 3);
      scene.add(pointLight);

      const pointLight2 = new THREE.PointLight(0x4466ff, 1.0, 20);
      pointLight2.position.set(-3, -3, 3);
      scene.add(pointLight2);

      // ==================== BRAIN SPHERE ====================
      const brainGeometry = new THREE.SphereGeometry(1.5, 64, 64);
      const brainMaterial = new THREE.MeshPhongMaterial({
        color: 0x2a1040,
        emissive: 0x1a0a2a,
        shininess: 30,
        transparent: true,
        opacity: 0.85,
        wireframe: false,
      });
      const brain = new THREE.Mesh(brainGeometry, brainMaterial);
      scene.add(brain);

      // ==================== WIREFRAME OVERLAY ====================
      const wireframeGeometry = new THREE.SphereGeometry(1.52, 32, 32);
      const wireframeMaterial = new THREE.MeshBasicMaterial({
        color: 0xffaa55,
        wireframe: true,
        transparent: true,
        opacity: 0.08,
      });
      const wireframe = new THREE.Mesh(wireframeGeometry, wireframeMaterial);
      scene.add(wireframe);

      // ==================== NEURONS (POINTS) ====================
      const neuronCount = 500;
      const neuronPositions = [];
      const neuronColors = [];

      for (let i = 0; i < neuronCount; i++) {
        // Distribuir puntos en una esfera
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 1.5 + (Math.random() * 0.1 - 0.05);

        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.sin(phi) * Math.sin(theta);
        const z = r * Math.cos(phi);

        neuronPositions.push(x, y, z);

        // Color según posición (simulando actividad)
        const intensity = Math.random();
        if (intensity > 0.8) {
          neuronColors.push(1.0, 0.6, 0.2); // Naranja brillante
        } else if (intensity > 0.5) {
          neuronColors.push(0.4, 0.6, 1.0); // Azul
        } else {
          neuronColors.push(0.6, 0.4, 1.0); // Púrpura
        }
      }

      const neuronGeometry = new THREE.BufferGeometry();
      neuronGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(neuronPositions, 3),
      );
      neuronGeometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(neuronColors, 3),
      );

      const neuronMaterial = new THREE.PointsMaterial({
        size: 0.04,
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
      });

      const neurons = new THREE.Points(neuronGeometry, neuronMaterial);
      scene.add(neurons);

      // ==================== ANIMATION ====================
      let time = 0;

      function animate() {
        requestAnimationFrame(animate);

        time += 0.01;

        // Pulso de opacidad en las neuronas
        neuronMaterial.opacity = 0.6 + Math.sin(time * 2) * 0.2;

        // Rotación de las neuronas
        neurons.rotation.y += 0.0005;
        neurons.rotation.x = Math.sin(time * 0.3) * 0.1;

        // Pulso de luz
        pointLight.intensity = 1.2 + Math.sin(time * 1.5) * 0.3;

        controls.update();
        renderer.render(scene, camera);
      }

      animate();

      // ==================== RESIZE ====================
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>

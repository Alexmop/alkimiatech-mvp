<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlkimiaTech Neuromap 3D</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #020105;
        font-family: "Segoe UI", sans-serif;
        color: white;
      }
      #info {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        pointer-events: none;
      }
      #info h1 {
        margin: 0;
        font-size: 1.5rem;
        color: #ffaa55;
        text-shadow: 0 0 10px #ffaa55;
      }
      #info p {
        margin: 4px 0;
        color: #ccc;
        font-size: 0.9rem;
      }

      /* Botones flotantes */
      #controls {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 15;
        display: flex;
        gap: 15px;
        background: rgba(0, 0, 0, 0.6);
        padding: 10px 20px;
        border-radius: 30px;
        border: 1px solid #333;
      }
      .control-btn {
        background: transparent;
        color: #fff;
        border: 1px solid #ffaa55;
        padding: 5px 15px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s;
      }
      .control-btn:hover,
      .control-btn.active {
        background: #ffaa55;
        color: #000;
        box-shadow: 0 0 10px #ffaa55;
      }

      /* Panel Clínico */
      #clinical-panel {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 35%;
        height: 90%;
        background: rgba(15, 5, 25, 0.95);
        border: 1px solid #ffaa55;
        border-radius: 12px;
        padding: 15px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: transform 0.4s ease-in-out;
        box-shadow: 0 4px 25px rgba(255, 170, 85, 0.2);
      }
      #clinical-panel.hidden {
        transform: translateX(110%);
      }
      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #333;
        padding-bottom: 10px;
      }
      .panel-header h2 {
        margin: 0;
        font-size: 1.1rem;
        color: #ffaa55;
      }
      .close-btn {
        cursor: pointer;
        color: #aaa;
        font-size: 1.5rem;
      }
      .close-btn:hover {
        color: #ff4444;
      }

      .pdf-viewer {
        flex-grow: 1;
        width: 100%;
        border-radius: 8px;
        border: 1px solid #333;
      }

      /* Botón para abrir el panel */
      #open-panel-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 9;
        background: #ffaa55;
        color: #000;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        display: none;
        box-shadow: 0 0 15px #ffaa55;
      }
      #open-panel-btn.visible {
        display: block;
      }

      /* Controles EEG dentro del panel */
      .eeg-controls {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
      }
      .eeg-btn {
        flex: 1;
        padding: 8px;
        background: #1a0a2a;
        color: #ffaa55;
        border: 1px solid #ffaa55;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      .eeg-btn.active {
        background: #ffaa55;
        color: #000;
        box-shadow: 0 0 10px #ffaa55;
      }

      /* Tooltip */
      #tooltip {
        position: absolute;
        background: rgba(10, 5, 20, 0.95);
        color: #fff;
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid #ffaa55;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 20;
        font-size: 0.85rem;
      }
      #tooltip h3 {
        margin: 0 0 4px 0;
        color: #ffaa55;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <h1>AlkimiaTech Neuromap</h1>
      <p>Live Synaptic Activity</p>
    </div>

    <!-- Controles Globales -->
    <div id="controls">
      <button
        class="control-btn active"
        id="btn-pulse"
        onclick="toggleAnimation()"
      >
        Pulsos: ON
      </button>
      <button class="control-btn" onclick="resetCamera()">
        Centrar Cámara
      </button>
    </div>

    <div id="tooltip">
      <h3 id="tt-name">Region</h3>
      <p id="tt-func" style="margin: 0">Function</p>
    </div>

    <!-- Botón para abrir panel (oculto por defecto) -->
    <button id="open-panel-btn" onclick="togglePanel()">
      Clinical EEG Monitoring
    </button>

    <!-- Panel Clínico -->
    <div id="clinical-panel">
      <div class="panel-header">
        <h2>Clinical EEG Monitoring</h2>
        <div class="close-btn" onclick="togglePanel()">×</div>
      </div>

      <div class="eeg-controls">
        <button
          class="eeg-btn active"
          id="btn-closed"
          onclick="setEEGState('closed')"
        >
          Eyes Closed
        </button>
        <button class="eeg-btn" id="btn-open" onclick="setEEGState('open')">
          Eyes Open
        </button>
      </div>

      <embed
        class="pdf-viewer"
        src="../../smartwatch_app/assets/eeg_scans/2025/EEG_2025-09-10.pdf"
        type="application/pdf"
      />
    </div>

    <script src="brain_regions.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      // ==================== GLOBAL STATE ====================
      let eegState = "closed";
      let isAnimating = true;

      window.setEEGState = function (state) {
        eegState = state;
        document
          .getElementById("btn-closed")
          .classList.toggle("active", state === "closed");
        document
          .getElementById("btn-open")
          .classList.toggle("active", state === "open");
      };

      window.togglePanel = function () {
        const panel = document.getElementById("clinical-panel");
        const btn = document.getElementById("open-panel-btn");
        panel.classList.toggle("hidden");
        btn.classList.toggle("visible");
        setTimeout(onWindowResize, 400);
      };

      window.toggleAnimation = function () {
        isAnimating = !isAnimating;
        const btn = document.getElementById("btn-pulse");
        btn.innerText = isAnimating ? "Pulsos: ON" : "Pulsos: OFF";
        btn.classList.toggle("active", isAnimating);
      };

      window.resetCamera = function () {
        camera.position.set(0, 0, 6);
        controls.target.set(0, 0, 0);
      };

      // ==================== SCENE ====================
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020105);
      scene.fog = new THREE.FogExp2(0x020105, 0.02);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 0, 6);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.5;

      // ==================== LIGHTS ====================
      const ambientLight = new THREE.AmbientLight(0x202040);
      scene.add(ambientLight);
      const pointLight = new THREE.PointLight(0xffaa55, 1.5, 20);
      pointLight.position.set(3, 3, 3);
      scene.add(pointLight);

      // ==================== BRAIN MESH (Base Suave) ====================
      const brainGroup = new THREE.Group();

      // Material oscuro para el cerebro de fondo
      const brainMaterial = new THREE.MeshPhongMaterial({
        color: 0x0a0515,
        emissive: 0x050210,
        shininess: 30,
        transparent: true,
        opacity: 0.95,
      });

      // Función para crear hemisferios suaves (como el anterior)
      function createHemisphere(sign) {
        const geometry = new THREE.SphereGeometry(1.5, 64, 64);
        const positions = geometry.attributes.position;
        const vertex = new THREE.Vector3();

        for (let i = 0; i < positions.count; i++) {
          vertex.fromBufferAttribute(positions, i);
          // Aplanar la base
          if (vertex.y < -0.5) {
            vertex.y = -0.5 + (vertex.y + 0.5) * 0.3;
          }
          // Surcos suaves
          const noise =
            Math.sin(vertex.x * 8) *
            Math.cos(vertex.y * 8) *
            Math.sin(vertex.z * 8);
          const displacement = noise * 0.06; // Menos ruido para que sea suave
          vertex.x += vertex.x * displacement;
          vertex.y += vertex.y * displacement;
          vertex.z += vertex.z * displacement;
          positions.setXYZ(i, vertex.x, vertex.y, vertex.z);
        }
        geometry.computeVertexNormals();
        const hemisphere = new THREE.Mesh(geometry, brainMaterial);
        hemisphere.scale.set(1, 0.85, 1.1);
        hemisphere.position.x = sign * 0.15;
        hemisphere.position.y = 0.1;
        return hemisphere;
      }

      brainGroup.add(createHemisphere(-1));
      brainGroup.add(createHemisphere(1));

      // Cerebelo (Parte de abajo visible)
      const cerebellumGeometry = new THREE.SphereGeometry(0.5, 32, 32);
      const cerebellum = new THREE.Mesh(cerebellumGeometry, brainMaterial);
      cerebellum.scale.set(1.5, 0.6, 0.8);
      cerebellum.position.set(0, -0.8, -0.3);
      brainGroup.add(cerebellum);

      // Tallo cerebral (Tronco encefálico)
      const stemGeometry = new THREE.CylinderGeometry(0.15, 0.25, 0.8, 16);
      const stem = new THREE.Mesh(stemGeometry, brainMaterial);
      stem.position.set(0, -1.2, 0.2);
      stem.rotation.x = 0.3;
      brainGroup.add(stem);

      scene.add(brainGroup);

      // ==================== NEURONS (Miles de puntos) ====================
      const neuronCount = 4000;
      const neuronPositions = [];
      const neuronColors = [];

      for (let i = 0; i < neuronCount; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        // Radio ajustado a la superficie del cerebro suave
        const r = 1.45 + Math.random() * 0.1;

        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.sin(phi) * Math.sin(theta) * 0.85 + 0.1;
        const z = r * Math.cos(phi) * 1.1;

        if (y > -0.6) {
          neuronPositions.push(x, y, z);
          // Colores base: Azul cian y púrpura
          if (Math.random() > 0.85) {
            neuronColors.push(0.0, 1.0, 1.0); // Cyan
          } else {
            neuronColors.push(0.6, 0.2, 1.0); // Purple
          }
        }
      }

      const neuronGeometry = new THREE.BufferGeometry();
      neuronGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(neuronPositions, 3),
      );
      neuronGeometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(neuronColors, 3),
      );

      // Textura circular para el brillo
      const canvas = document.createElement("canvas");
      canvas.width = 32;
      canvas.height = 32;
      const context = canvas.getContext("2d");
      const gradient = context.createRadialGradient(16, 16, 0, 16, 16, 16);
      gradient.addColorStop(0, "rgba(255,255,255,1)");
      gradient.addColorStop(0.2, "rgba(255,255,255,0.8)");
      gradient.addColorStop(1, "rgba(0,0,0,0)");
      context.fillStyle = gradient;
      context.fillRect(0, 0, 32, 32);
      const neuronTexture = new THREE.CanvasTexture(canvas);

      const neuronMaterial = new THREE.PointsMaterial({
        size: 0.05,
        map: neuronTexture,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      const neurons = new THREE.Points(neuronGeometry, neuronMaterial);
      brainGroup.add(neurons);

      // ==================== SYNAPSES (Conexiones) ====================
      const connectionPositions = [];
      const connectionCount = 2500;

      for (let i = 0; i < connectionCount; i++) {
        const idx1 =
          Math.floor(Math.random() * (neuronPositions.length / 3)) * 3;
        const idx2 =
          Math.floor(Math.random() * (neuronPositions.length / 3)) * 3;
        const x1 = neuronPositions[idx1],
          y1 = neuronPositions[idx1 + 1],
          z1 = neuronPositions[idx1 + 2];
        const x2 = neuronPositions[idx2],
          y2 = neuronPositions[idx2 + 1],
          z2 = neuronPositions[idx2 + 2];

        const dist = Math.sqrt(
          Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2) + Math.pow(z2 - z1, 2),
        );
        if (dist < 0.35) {
          // Conectar solo las cercanas
          connectionPositions.push(x1, y1, z1, x2, y2, z2);
        }
      }

      const connectionGeometry = new THREE.BufferGeometry();
      connectionGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(connectionPositions, 3),
      );

      const connectionMaterial = new THREE.LineBasicMaterial({
        color: 0x3366ff,
        transparent: true,
        opacity: 0.15,
        blending: THREE.AdditiveBlending,
      });
      const connections = new THREE.LineSegments(
        connectionGeometry,
        connectionMaterial,
      );
      brainGroup.add(connections);

      // ==================== PULSOS DE LUZ ====================
      const pulseCount = 120;
      const pulseGeometry = new THREE.BufferGeometry();
      const pulsePositions = new Float32Array(pulseCount * 3);

      const pulsesData = [];
      for (let i = 0; i < pulseCount; i++) {
        const lineIdx =
          Math.floor(Math.random() * (connectionPositions.length / 6)) * 6;
        pulsesData.push({
          start: new THREE.Vector3(
            connectionPositions[lineIdx],
            connectionPositions[lineIdx + 1],
            connectionPositions[lineIdx + 2],
          ),
          end: new THREE.Vector3(
            connectionPositions[lineIdx + 3],
            connectionPositions[lineIdx + 4],
            connectionPositions[lineIdx + 5],
          ),
          progress: Math.random(),
          speed: 0.01 + Math.random() * 0.02,
        });
        pulsePositions[i * 3] = pulsesData[i].start.x;
        pulsePositions[i * 3 + 1] = pulsesData[i].start.y;
        pulsePositions[i * 3 + 2] = pulsesData[i].start.z;
      }

      pulseGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(pulsePositions, 3),
      );
      const pulseMaterial = new THREE.PointsMaterial({
        size: 0.12,
        color: 0x00ffff,
        transparent: true,
        opacity: 1,
        blending: THREE.AdditiveBlending,
        map: neuronTexture,
      });
      const pulses = new THREE.Points(pulseGeometry, pulseMaterial);
      brainGroup.add(pulses);

      // ==================== ANATOMICAL REGIONS ====================
      const regionNodes = [];
      if (window.brainRegions) {
        window.brainRegions.forEach((region) => {
          const regionGeo = new THREE.SphereGeometry(0.06, 16, 16);
          const regionMat = new THREE.MeshBasicMaterial({
            color: region.color,
            transparent: true,
            opacity: 0.9,
          });
          const regionMesh = new THREE.Mesh(regionGeo, regionMat);
          regionMesh.position.set(region.pos.x, region.pos.y, region.pos.z);
          regionMesh.userData = { name: region.name, func: region.function };
          brainGroup.add(regionMesh);
          regionNodes.push(regionMesh);
        });
      }

      // ==================== TOOLTIP HOVER ====================
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const tooltip = document.getElementById("tooltip");
      const ttName = document.getElementById("tt-name");
      const ttFunc = document.getElementById("tt-func");

      window.addEventListener("mousemove", (event) => {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(regionNodes);

        if (intersects.length > 0) {
          const hit = intersects[0].object;
          ttName.innerText = hit.userData.name;
          ttFunc.innerText = hit.userData.func;
          tooltip.style.opacity = 1;
          tooltip.style.left = event.clientX + 15 + "px";
          tooltip.style.top = event.clientY + 15 + "px";
        } else {
          tooltip.style.opacity = 0;
        }
      });

      // ==================== ANIMATION LOOP ====================
      let time = 0;

      function animate() {
        requestAnimationFrame(animate);
        if (isAnimating) time += 0.02;

        if (isAnimating) {
          // Animar pulsos
          const positions = pulseGeometry.attributes.position.array;
          for (let i = 0; i < pulseCount; i++) {
            const p = pulsesData[i];
            p.progress += p.speed;
            if (p.progress > 1) {
              p.progress = 0;
              const lineIdx =
                Math.floor(Math.random() * (connectionPositions.length / 6)) *
                6;
              p.start.set(
                connectionPositions[lineIdx],
                connectionPositions[lineIdx + 1],
                connectionPositions[lineIdx + 2],
              );
              p.end.set(
                connectionPositions[lineIdx + 3],
                connectionPositions[lineIdx + 4],
                connectionPositions[lineIdx + 5],
              );
            }
            positions[i * 3] = p.start.x + (p.end.x - p.start.x) * p.progress;
            positions[i * 3 + 1] =
              p.start.y + (p.end.y - p.start.y) * p.progress;
            positions[i * 3 + 2] =
              p.start.z + (p.end.z - p.start.z) * p.progress;
          }
          pulseGeometry.attributes.position.needsUpdate = true;

          // Respiración sutil
          brainGroup.scale.setScalar(1 + Math.sin(time * 2) * 0.005);

          // Rotación
          brainGroup.rotation.y += 0.001;
        }

        controls.update();
        renderer.render(scene, camera);
      }

      // ==================== RESIZE DINÁMICO ====================
      function onWindowResize() {
        const panel = document.getElementById("clinical-panel");
        const isHidden = panel.classList.contains("hidden");
        const width = isHidden ? window.innerWidth : window.innerWidth * 0.65;

        camera.aspect = width / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(width, window.innerHeight);
      }

      window.addEventListener("resize", onWindowResize);
      onWindowResize();
      animate();
    </script>
  </body>
</html>

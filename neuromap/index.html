<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlkimiaTech Neuromap 3D</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #0b0a1a;
        font-family: "Segoe UI", sans-serif;
      }
      #info {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #ffaa55;
        font-size: 1.2rem;
        z-index: 10;
      }
      #info h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      #info p {
        margin: 4px 0;
        color: #ccc;
        font-size: 0.9rem;
      }
      #status {
        position: absolute;
        bottom: 20px;
        left: 20px;
        color: #88ff88;
        font-size: 0.85rem;
        z-index: 10;
        background: rgba(0, 0, 0, 0.5);
        padding: 8px 16px;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <h1>AlkimiaTech Neuromap 3D</h1>
      <p>Live brain visualization for neurological monitoring</p>
    </div>
    <div id="status">○ Connecting to backend...</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      // ==================== SCENE ====================
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0a1a);
      scene.fog = new THREE.FogExp2(0x0b0a1a, 0.05);

      // ==================== CAMERA ====================
      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 0.5, 4);

      // ==================== RENDERER ====================
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      // ==================== CONTROLS ====================
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.8;

      // ==================== LIGHTS ====================
      const ambientLight = new THREE.AmbientLight(0x404060);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0xffaa55, 2, 20);
      pointLight.position.set(3, 3, 3);
      scene.add(pointLight);

      const pointLight2 = new THREE.PointLight(0x4466ff, 1.5, 20);
      pointLight2.position.set(-3, -2, 3);
      scene.add(pointLight2);

      // ==================== BRAIN ====================
      const brainGroup = new THREE.Group();

      const brainMaterial = new THREE.MeshPhongMaterial({
        color: 0x3a1a5a,
        emissive: 0x1a0a2a,
        shininess: 40,
        transparent: true,
        opacity: 0.85,
      });

      function createHemisphere(sign) {
        const geometry = new THREE.SphereGeometry(1.4, 64, 64);
        const positions = geometry.attributes.position;
        const vertex = new THREE.Vector3();

        for (let i = 0; i < positions.count; i++) {
          vertex.fromBufferAttribute(positions, i);
          if (vertex.y < -0.5) {
            vertex.y = -0.5 + (vertex.y + 0.5) * 0.3;
          }
          const noise =
            Math.sin(vertex.x * 8) *
            Math.cos(vertex.y * 8) *
            Math.sin(vertex.z * 8);
          const displacement = noise * 0.08;
          vertex.x += vertex.x * displacement;
          vertex.y += vertex.y * displacement;
          vertex.z += vertex.z * displacement;
          positions.setXYZ(i, vertex.x, vertex.y, vertex.z);
        }
        geometry.computeVertexNormals();
        const hemisphere = new THREE.Mesh(geometry, brainMaterial);
        hemisphere.scale.set(1, 0.85, 1.1);
        hemisphere.position.x = sign * 0.15;
        hemisphere.position.y = 0.1;
        return hemisphere;
      }

      brainGroup.add(createHemisphere(-1));
      brainGroup.add(createHemisphere(1));

      // Cerebellum
      const cerebellumGeometry = new THREE.SphereGeometry(0.5, 32, 32);
      const cerebellumMaterial = new THREE.MeshPhongMaterial({
        color: 0x2a1040,
        emissive: 0x1a0a2a,
        shininess: 20,
        transparent: true,
        opacity: 0.8,
      });
      const cerebellum = new THREE.Mesh(cerebellumGeometry, cerebellumMaterial);
      cerebellum.scale.set(1.5, 0.6, 0.8);
      cerebellum.position.set(0, -0.8, -0.3);
      brainGroup.add(cerebellum);

      // Brain stem
      const stemGeometry = new THREE.CylinderGeometry(0.15, 0.25, 0.8, 16);
      const stemMaterial = new THREE.MeshPhongMaterial({
        color: 0x2a1040,
        emissive: 0x1a0a2a,
        shininess: 20,
        transparent: true,
        opacity: 0.8,
      });
      const stem = new THREE.Mesh(stemGeometry, stemMaterial);
      stem.position.set(0, -1.2, 0.2);
      stem.rotation.x = 0.3;
      brainGroup.add(stem);

      scene.add(brainGroup);

      // ==================== NEURONS ====================
      const neuronCount = 800;
      const neuronPositions = [];
      const neuronColors = [];

      for (let i = 0; i < neuronCount; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const baseR = 1.4;
        const noise = Math.sin(theta * 6) * Math.cos(phi * 6) * 0.15;
        const r = baseR + noise;

        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.sin(phi) * Math.sin(theta) * 0.85 + 0.1;
        const z = r * Math.cos(phi) * 1.1;

        if (y > -0.6) {
          neuronPositions.push(x, y, z);
          neuronColors.push(0.5, 0.3, 0.9);
        }
      }

      const neuronGeometry = new THREE.BufferGeometry();
      neuronGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(neuronPositions, 3),
      );
      neuronGeometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(neuronColors, 3),
      );

      const neuronMaterial = new THREE.PointsMaterial({
        size: 0.04,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
      });

      const neurons = new THREE.Points(neuronGeometry, neuronMaterial);
      scene.add(neurons);

      // ==================== CONNECTIONS ====================
      const connectionPositions = [];
      for (let i = 0; i < 200; i++) {
        const idx1 =
          Math.floor(Math.random() * (neuronPositions.length / 3)) * 3;
        const idx2 =
          Math.floor(Math.random() * (neuronPositions.length / 3)) * 3;
        const x1 = neuronPositions[idx1],
          y1 = neuronPositions[idx1 + 1],
          z1 = neuronPositions[idx1 + 2];
        const x2 = neuronPositions[idx2],
          y2 = neuronPositions[idx2 + 1],
          z2 = neuronPositions[idx2 + 2];
        const dist = Math.sqrt(
          Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2) + Math.pow(z2 - z1, 2),
        );
        if (dist < 0.8) {
          connectionPositions.push(x1, y1, z1, x2, y2, z2);
        }
      }

      const connectionGeometry = new THREE.BufferGeometry();
      connectionGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(connectionPositions, 3),
      );
      const connectionMaterial = new THREE.LineBasicMaterial({
        color: 0x4466ff,
        transparent: true,
        opacity: 0.15,
      });
      const connections = new THREE.LineSegments(
        connectionGeometry,
        connectionMaterial,
      );
      scene.add(connections);

      // ==================== LIVE DATA CONNECTION ====================
      const API_URL = "http://192.168.1.72:8080/api/neuromap";

      async function fetchNeuromapData() {
        try {
          const response = await fetch(API_URL);
          const data = await response.json();
          updateBrainActivity(data);
          document.getElementById("status").innerHTML =
            `● Live | HR: ${data.heart_rate} bpm | SpO₂: ${data.oxygen_level}%`;
        } catch (error) {
          document.getElementById("status").innerHTML =
            "○ Waiting for backend...";
        }
      }

      function updateBrainActivity(data) {
        const positions = neuronGeometry.attributes.position.array;
        const colors = neuronGeometry.attributes.color.array;

        const regions = {
          frontal: (x, y, z) => z > 0.5,
          temporal: (x, y, z) => Math.abs(x) > 0.8,
          parietal: (x, y, z) => y > 0.5,
          occipital: (x, y, z) => z < -0.5,
          cerebellum: (x, y, z) => y < -0.5,
        };

        for (let i = 0; i < positions.length; i += 3) {
          const x = positions[i];
          const y = positions[i + 1];
          const z = positions[i + 2];

          let intensity = 0.3;

          for (const [region, test] of Object.entries(regions)) {
            if (test(x, y, z)) {
              const regionData = data.brain_activity.find(
                (r) => r.region === region,
              );
              if (regionData) {
                intensity = regionData.intensity;
              }
              break;
            }
          }

          if (intensity > 0.7) {
            colors[i] = 1.0;
            colors[i + 1] = 0.6;
            colors[i + 2] = 0.2;
          } else if (intensity > 0.4) {
            colors[i] = 0.4;
            colors[i + 1] = 0.6;
            colors[i + 2] = 1.0;
          } else {
            colors[i] = 0.3;
            colors[i + 1] = 0.1;
            colors[i + 2] = 0.5;
          }
        }

        neuronGeometry.attributes.color.needsUpdate = true;
      }

      setInterval(fetchNeuromapData, 2000);
      fetchNeuromapData();

      // ==================== ANIMATION ====================
      let time = 0;

      function animate() {
        requestAnimationFrame(animate);
        time += 0.01;

        neuronMaterial.opacity = 0.7 + Math.sin(time * 2) * 0.25;
        connectionMaterial.opacity = 0.1 + Math.sin(time * 1.5) * 0.1;

        brainGroup.rotation.y += 0.001;
        neurons.rotation.y += 0.001;
        connections.rotation.y += 0.001;

        pointLight.intensity = 1.5 + Math.sin(time * 1.5) * 0.5;

        controls.update();
        renderer.render(scene, camera);
      }

      animate();

      // ==================== RESIZE ====================
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>

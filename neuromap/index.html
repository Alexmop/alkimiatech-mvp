<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlkimiaTech Neuromap 3D</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #050d21;
        font-family: "Segoe UI", sans-serif;
        color: white;
      }
      #info {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        pointer-events: none;
      }
      #info h1 {
        margin: 0;
        font-size: 1.5rem;
        color: #00ffff;
        text-shadow: 0 0 10px #00ffff;
      }
      #info p {
        margin: 4px 0;
        color: #ccc;
        font-size: 0.9rem;
      }

      /* Menú Selector (Digital Twin) */
      #layer-menu {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 15;
        display: flex;
        gap: 10px;
        background: rgba(5, 15, 25, 0.8);
        padding: 10px 20px;
        border-radius: 30px;
        border: 1px solid #00ffff;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
      }
      .layer-btn {
        background: transparent;
        color: #fff;
        border: 1px solid #00ffff;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: bold;
      }
      .layer-btn:hover,
      .layer-btn.active {
        background: #00ffff;
        color: #000;
        box-shadow: 0 0 10px #00ffff;
      }

      #clinical-panel {
        position: absolute;
        top: 80px;
        right: -40%;
        width: 35%;
        height: 85%;
        background: transparent;
        border: 1px solid #00ffff;
        border-radius: 12px;
        padding: 15px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: right 0.4s ease-in-out;
      }
      #clinical-panel.open {
        right: 20px;
      }
      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #00ffff;
        padding-bottom: 10px;
        background: rgba(5, 15, 25, 0.9);
        border-radius: 8px 8px 0 0;
        padding: 10px;
      }
      .panel-header h2 {
        margin: 0;
        font-size: 1.1rem;
        color: #00ffff;
      }
      .close-btn {
        cursor: pointer;
        color: #aaa;
        font-size: 1.5rem;
      }
      .pdf-viewer {
        flex-grow: 1;
        width: 100%;
        border-radius: 8px;
        border: 1px solid #333;
        background: white;
      }
      #open-panel-btn {
        position: absolute;
        top: 80px;
        right: 20px;
        z-index: 9;
        background: #00ffff;
        color: #000;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 15px #00ffff;
      }
      .eeg-controls {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        background: rgba(5, 15, 25, 0.9);
        padding: 10px;
        border-radius: 8px;
      }
      .eeg-btn {
        flex: 1;
        padding: 8px;
        background: #0a1525;
        color: #00ffff;
        border: 1px solid #00ffff;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      .eeg-btn.active {
        background: #00ffff;
        color: #000;
        box-shadow: 0 0 10px #00ffff;
      }

      #tooltip {
        position: absolute;
        background: rgba(5, 15, 25, 0.95);
        color: #fff;
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid #00ffff;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 20;
        font-size: 0.85rem;
      }
      #tooltip h3 {
        margin: 0 0 4px 0;
        color: #00ffff;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <h1>AlkimiaTech Neuromap</h1>
      <p>Multimodal Digital Twin</p>
    </div>

    <!-- Menú de Capas -->
    <div id="layer-menu">
      <button
        class="layer-btn active"
        id="btn-general"
        onclick="setLayer('general')"
      >
        General
      </button>
      <button
        class="layer-btn"
        id="btn-alzheimer"
        onclick="setLayer('alzheimer')"
      >
        Alzheimer
      </button>
      <button
        class="layer-btn"
        id="btn-parkinson"
        onclick="setLayer('parkinson')"
      >
        Parkinson
      </button>
    </div>

    <div id="tooltip">
      <h3 id="tt-name">Region</h3>
      <p id="tt-func" style="margin: 0">Function</p>
    </div>
    <button id="open-panel-btn" onclick="togglePanel()">Clinical Data</button>

    <div id="clinical-panel">
      <div class="panel-header">
        <h2>Clinical Data (EEG)</h2>
        <div class="close-btn" onclick="togglePanel()">×</div>
      </div>
      <div class="eeg-controls">
        <button
          class="eeg-btn active"
          id="btn-closed"
          onclick="setEEGState('closed')"
        >
          Eyes Closed
        </button>
        <button class="eeg-btn" id="btn-open" onclick="setEEGState('open')">
          Eyes Open
        </button>
      </div>
      <embed
        class="pdf-viewer"
        src="../../smartwatch_app/assets/eeg_scans/2025/EEG_2025-09-10.pdf"
        type="application/pdf"
      />
    </div>

    <script src="brain_regions.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      // ==================== GLOBAL STATE ====================
      let eegState = "closed";
      let isAnimating = true;
      let currentLayer = "general";

      window.setEEGState = function (state) {
        eegState = state;
        document
          .getElementById("btn-closed")
          .classList.toggle("active", state === "closed");
        document
          .getElementById("btn-open")
          .classList.toggle("active", state === "open");
      };
      window.togglePanel = function () {
        const panel = document.getElementById("clinical-panel");
        panel.classList.toggle("open");
        setTimeout(onWindowResize, 400);
      };
      window.toggleAnimation = function () {
        isAnimating = !isAnimating;
      };
      window.setLayer = function (layer) {
        currentLayer = layer;
        document
          .querySelectorAll(".layer-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document.getElementById("btn-" + layer).classList.add("active");

        // Cambiar colores de las regiones según la capa
        regionNodes.forEach((node) => {
          if (layer === "alzheimer" && node.userData.id === "hippocampus") {
            node.material.color.setHex(0xff0000); // Rojo para Alzheimer
            node.scale.set(2, 2, 2); // Hacerlo más grande
          } else if (
            layer === "parkinson" &&
            node.userData.id === "substantia_nigra"
          ) {
            node.material.color.setHex(0xffaa00); // Ámbar para Parkinson
            node.scale.set(2, 2, 2);
          } else {
            node.material.color.setHex(node.userData.originalColor);
            node.scale.set(1, 1, 1);
          }
        });
      };
      window.resetCamera = function () {
        camera.position.set(0, 0, 5);
        controls.target.set(0, 0, 0);
      };

      // ==================== SCENE ====================
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050d21);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 0, 5);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.4;

      // ==================== STARFIELD ====================
      const starCanvas = document.createElement("canvas");
      starCanvas.width = 16;
      starCanvas.height = 16;
      const starCtx = starCanvas.getContext("2d");
      const starGrad = starCtx.createRadialGradient(8, 8, 0, 8, 8, 8);
      starGrad.addColorStop(0, "rgba(255,255,255,1)");
      starGrad.addColorStop(0.5, "rgba(255,255,255,0.5)");
      starGrad.addColorStop(1, "rgba(255,255,255,0)");
      starCtx.fillStyle = starGrad;
      starCtx.fillRect(0, 0, 16, 16);
      const starTexture = new THREE.CanvasTexture(starCanvas);

      const starGeometry = new THREE.BufferGeometry();
      const starCount = 4000;
      const starPositions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount * 3; i++)
        starPositions[i] = (Math.random() - 0.5) * 60;
      starGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(starPositions, 3),
      );
      const starMaterial = new THREE.PointsMaterial({
        size: 0.1,
        map: starTexture,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const stars = new THREE.Points(starGeometry, starMaterial);
      scene.add(stars);

      // ==================== LIGHTS ====================
      scene.add(new THREE.AmbientLight(0x404060));
      const pointLight = new THREE.PointLight(0x00ffff, 2, 20);
      pointLight.position.set(3, 3, 3);
      scene.add(pointLight);
      const pointLight2 = new THREE.PointLight(0x4466ff, 2, 20);
      pointLight2.position.set(-3, -2, 3);
      scene.add(pointLight2);

      // ==================== PROCEDURAL ANATOMICAL BRAIN ====================
      const brainGroup = new THREE.Group();

      const brainMaterial = new THREE.MeshPhongMaterial({
        color: 0xb388ff,
        emissive: 0x4a2a8a,
        shininess: 120,
        transparent: true,
        opacity: 0.2,
        side: THREE.DoubleSide,
        depthWrite: false,
      });

      function applyBrainFolds(vertex) {
        const freq = 8;
        const noise =
          Math.sin(vertex.x * freq) *
          Math.cos(vertex.y * freq) *
          Math.sin(vertex.z * freq);
        const displacement = noise * 0.03;
        vertex.x += vertex.x * displacement;
        vertex.y += vertex.y * displacement;
        vertex.z += vertex.z * displacement;

        if (Math.abs(vertex.x) < 0.05 && vertex.y > 0) {
          vertex.x += Math.sign(vertex.x) * 0.05;
        }
        return vertex;
      }

      function createHemisphere(sign) {
        const geometry = new THREE.SphereGeometry(1.4, 128, 128);
        const positions = geometry.attributes.position;
        const vertex = new THREE.Vector3();
        for (let i = 0; i < positions.count; i++) {
          vertex.fromBufferAttribute(positions, i);
          if (vertex.y < -0.4) vertex.y = -0.4 + (vertex.y + 0.4) * 0.3;
          vertex.copy(applyBrainFolds(vertex));
          positions.setXYZ(i, vertex.x, vertex.y, vertex.z);
        }
        geometry.computeVertexNormals();
        const hemisphere = new THREE.Mesh(geometry, brainMaterial);
        hemisphere.scale.set(1, 0.85, 1.3);
        hemisphere.position.x = sign * 0.15;
        return hemisphere;
      }
      brainGroup.add(createHemisphere(-1));
      brainGroup.add(createHemisphere(1));

      const cbGeo = new THREE.SphereGeometry(0.65, 64, 64);
      const cbPositions = cbGeo.attributes.position;
      const cbVertex = new THREE.Vector3();
      for (let i = 0; i < cbPositions.count; i++) {
        cbVertex.fromBufferAttribute(cbPositions, i);
        const fold = Math.sin(cbVertex.y * 40) * 0.03;
        cbVertex.x += cbVertex.x * fold;
        cbVertex.z += cbVertex.z * fold;
        cbPositions.setXYZ(i, cbVertex.x, cbVertex.y, cbVertex.z);
      }
      cbGeo.computeVertexNormals();
      const cerebellum = new THREE.Mesh(cbGeo, brainMaterial);
      cerebellum.scale.set(1.4, 0.6, 0.9);
      cerebellum.position.set(0, -0.7, -0.8);
      brainGroup.add(cerebellum);

      const stemGeo = new THREE.CylinderGeometry(0.12, 0.22, 1.0, 32, 10);
      const stemPositions = stemGeo.attributes.position;
      const stemVertex = new THREE.Vector3();
      for (let i = 0; i < stemPositions.count; i++) {
        stemVertex.fromBufferAttribute(stemPositions, i);
        if (stemVertex.y < 0)
          stemVertex.z -= Math.pow(Math.abs(stemVertex.y), 2) * 0.6;
        stemPositions.setXYZ(i, stemVertex.x, stemVertex.y, stemVertex.z);
      }
      stemGeo.computeVertexNormals();
      const stem = new THREE.Mesh(stemGeo, brainMaterial);
      stem.position.set(0, -1.1, -0.2);
      stem.rotation.x = 0.2;
      brainGroup.add(stem);

      scene.add(brainGroup);

      // ==================== ANATOMICAL REGIONS (Con Alzheimer y Parkinson) ====================
      const regionNodes = [];
      const regionsData = [
        {
          id: "frontal",
          name: "Frontal Lobe",
          func: "Executive functions, motor control",
          color: 0xffaa55,
          pos: { x: 0, y: 0.8, z: 1.0 },
        },
        {
          id: "parietal",
          name: "Parietal Lobe",
          func: "Somatic sensations",
          color: 0x44ff88,
          pos: { x: 0, y: 1.2, z: 0 },
        },
        {
          id: "temporal",
          name: "Temporal Lobe",
          func: "Auditory, memory",
          color: 0x4466ff,
          pos: { x: 1.2, y: 0, z: 0.2 },
        },
        {
          id: "occipital",
          name: "Occipital Lobe",
          func: "Visual processing",
          color: 0xff4466,
          pos: { x: 0, y: 0.2, z: -1.2 },
        },
        {
          id: "cerebellum_reg",
          name: "Cerebellum",
          func: "Motor coordination",
          color: 0x88ff88,
          pos: { x: 0, y: -1.0, z: -0.5 },
        },
        // Nuevas regiones patológicas
        {
          id: "hippocampus",
          name: "Hippocampus",
          func: "Memory (Alzheimer affected)",
          color: 0xff00ff,
          pos: { x: 0.5, y: -0.1, z: 0.2 },
        },
        {
          id: "substantia_nigra",
          name: "Substantia Nigra",
          func: "Motor control (Parkinson affected)",
          color: 0xffff00,
          pos: { x: 0, y: -0.4, z: -0.1 },
        },
      ];

      regionsData.forEach((region) => {
        const regionGeo = new THREE.SphereGeometry(0.06, 16, 16);
        const regionMat = new THREE.MeshBasicMaterial({
          color: region.color,
          transparent: true,
          opacity: 0.8,
        });
        const regionMesh = new THREE.Mesh(regionGeo, regionMat);
        regionMesh.position.set(
          region.pos.x * 1.0,
          region.pos.y * 0.9,
          region.pos.z * 1.3,
        );
        regionMesh.userData = {
          id: region.id,
          name: region.name,
          func: region.function || region.func,
          originalColor: region.color,
        };
        brainGroup.add(regionMesh);
        regionNodes.push(regionMesh);
      });

      // ==================== NEURONS & CONNECTIONS ====================
      const neuronCount = 1200;
      const neuronPositions = [];
      const neuronColors = [];

      for (let i = 0; i < neuronCount; i++) {
        const u = Math.random();
        const v = Math.random();
        const theta = 2 * Math.PI * u;
        const phi = Math.acos(2 * v - 1);
        const r = Math.cbrt(Math.random()) * 1.3;

        let x = r * Math.sin(phi) * Math.cos(theta);
        let y = r * Math.sin(phi) * Math.sin(theta) * 0.85;
        let z = r * Math.cos(phi) * 1.3;

        if (y < -0.5 && Math.random() > 0.5) {
          x = (Math.random() - 0.5) * 1.0;
          y = -0.6 - Math.random() * 0.5;
          z = -0.5 - Math.random() * 0.5;
        }

        neuronPositions.push(x, y, z);
        const colorType = Math.random();
        if (colorType > 0.85) neuronColors.push(0.0, 1.0, 1.0);
        else if (colorType > 0.6) neuronColors.push(1.0, 0.4, 0.8);
        else neuronColors.push(1.0, 1.0, 1.0);
      }

      const neuronGeometry = new THREE.BufferGeometry();
      neuronGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(neuronPositions, 3),
      );
      neuronGeometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(neuronColors, 3),
      );

      const ptCanvas = document.createElement("canvas");
      ptCanvas.width = 32;
      ptCanvas.height = 32;
      const ptCtx = ptCanvas.getContext("2d");
      const ptGrad = ptCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
      ptGrad.addColorStop(0, "rgba(255,255,255,1)");
      ptGrad.addColorStop(0.3, "rgba(255,255,255,0.6)");
      ptGrad.addColorStop(1, "rgba(0,0,0,0)");
      ptCtx.fillStyle = ptGrad;
      ptCtx.fillRect(0, 0, 32, 32);
      const pointTexture = new THREE.CanvasTexture(ptCanvas);

      const neuronMaterial = new THREE.PointsMaterial({
        size: 0.08,
        map: pointTexture,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const neurons = new THREE.Points(neuronGeometry, neuronMaterial);
      brainGroup.add(neurons);

      const connectionPositions = [];
      for (let i = 0; i < 2500; i++) {
        const idx1 =
          Math.floor(Math.random() * (neuronPositions.length / 3)) * 3;
        const idx2 =
          Math.floor(Math.random() * (neuronPositions.length / 3)) * 3;
        const x1 = neuronPositions[idx1],
          y1 = neuronPositions[idx1 + 1],
          z1 = neuronPositions[idx1 + 2];
        const x2 = neuronPositions[idx2],
          y2 = neuronPositions[idx2 + 1],
          z2 = neuronPositions[idx2 + 2];
        const dist = Math.sqrt(
          Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2) + Math.pow(z2 - z1, 2),
        );
        if (dist < 0.4) connectionPositions.push(x1, y1, z1, x2, y2, z2);
      }
      const connectionGeometry = new THREE.BufferGeometry();
      connectionGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(connectionPositions, 3),
      );
      const connectionMaterial = new THREE.LineBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0.15,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const connections = new THREE.LineSegments(
        connectionGeometry,
        connectionMaterial,
      );
      brainGroup.add(connections);

      // ==================== PULSOS DE LUZ ====================
      const pulseCount = 400;
      const pulseGeometry = new THREE.BufferGeometry();
      const pulsePositions = new Float32Array(pulseCount * 3);
      const pulseColors = new Float32Array(pulseCount * 3);

      const pulsesData = [];
      const colorsPalette = [
        new THREE.Color(0x00ffff),
        new THREE.Color(0x66ffaa),
        new THREE.Color(0xffdd44),
        new THREE.Color(0xff66aa),
      ];

      for (let i = 0; i < pulseCount; i++) {
        const lineIdx =
          Math.floor(Math.random() * (connectionPositions.length / 6)) * 6;
        pulsesData.push({
          start: new THREE.Vector3(
            connectionPositions[lineIdx],
            connectionPositions[lineIdx + 1],
            connectionPositions[lineIdx + 2],
          ),
          end: new THREE.Vector3(
            connectionPositions[lineIdx + 3],
            connectionPositions[lineIdx + 4],
            connectionPositions[lineIdx + 5],
          ),
          progress: Math.random(),
          speed: 0.01 + Math.random() * 0.02,
        });
        pulsePositions[i * 3] = pulsesData[i].start.x;
        pulsePositions[i * 3 + 1] = pulsesData[i].start.y;
        pulsePositions[i * 3 + 2] = pulsesData[i].start.z;

        const c =
          colorsPalette[Math.floor(Math.random() * colorsPalette.length)];
        pulseColors[i * 3] = c.r;
        pulseColors[i * 3 + 1] = c.g;
        pulseColors[i * 3 + 2] = c.b;
      }

      pulseGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(pulsePositions, 3),
      );
      pulseGeometry.setAttribute(
        "color",
        new THREE.BufferAttribute(pulseColors, 3),
      );

      const pulseMaterial = new THREE.PointsMaterial({
        size: 0.15,
        map: pointTexture,
        vertexColors: true,
        transparent: true,
        opacity: 1,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const pulses = new THREE.Points(pulseGeometry, pulseMaterial);
      brainGroup.add(pulses);

      // ==================== CHISPAS TITILANTES ====================
      const sparkleCount = 200;
      const sparkleGeometry = new THREE.BufferGeometry();
      const sparklePositions = new Float32Array(sparkleCount * 3);
      for (let i = 0; i < sparkleCount; i++) {
        const idx =
          Math.floor(Math.random() * (neuronPositions.length / 3)) * 3;
        sparklePositions[i * 3] = neuronPositions[idx];
        sparklePositions[i * 3 + 1] = neuronPositions[idx + 1];
        sparklePositions[i * 3 + 2] = neuronPositions[idx + 2];
      }
      sparkleGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(sparklePositions, 3),
      );

      const sparkleMaterial = new THREE.PointsMaterial({
        size: 0.2,
        color: 0xffffff,
        map: pointTexture,
        transparent: true,
        opacity: 1,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const sparkles = new THREE.Points(sparkleGeometry, sparkleMaterial);
      brainGroup.add(sparkles);

      // ==================== TOOLTIP HOVER ====================
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const tooltip = document.getElementById("tooltip");
      const ttName = document.getElementById("tt-name");
      const ttFunc = document.getElementById("tt-func");

      window.addEventListener("mousemove", (event) => {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        raycaster.params.Points.threshold = 0.1;

        const intersects = raycaster.intersectObjects(regionNodes);

        if (intersects.length > 0) {
          const hit = intersects[0].object;
          ttName.innerText = hit.userData.name;
          ttFunc.innerText = hit.userData.func;
          tooltip.style.opacity = 1;
          tooltip.style.left = event.clientX + 15 + "px";
          tooltip.style.top = event.clientY + 15 + "px";
        } else {
          tooltip.style.opacity = 0;
        }
      });

      // ==================== ANIMATION ====================
      let time = 0;
      function animate() {
        requestAnimationFrame(animate);
        if (isAnimating) time += 0.02;

        if (isAnimating) {
          const positions = pulseGeometry.attributes.position.array;
          for (let i = 0; i < pulseCount; i++) {
            const p = pulsesData[i];
            p.progress += p.speed;
            if (p.progress > 1) {
              p.progress = 0;
              const lineIdx =
                Math.floor(Math.random() * (connectionPositions.length / 6)) *
                6;
              p.start.set(
                connectionPositions[lineIdx],
                connectionPositions[lineIdx + 1],
                connectionPositions[lineIdx + 2],
              );
              p.end.set(
                connectionPositions[lineIdx + 3],
                connectionPositions[lineIdx + 4],
                connectionPositions[lineIdx + 5],
              );
            }
            positions[i * 3] = p.start.x + (p.end.x - p.start.x) * p.progress;
            positions[i * 3 + 1] =
              p.start.y + (p.end.y - p.start.y) * p.progress;
            positions[i * 3 + 2] =
              p.start.z + (p.end.z - p.start.z) * p.progress;
          }
          pulseGeometry.attributes.position.needsUpdate = true;

          sparkleMaterial.opacity = 0.5 + Math.sin(time * 3) * 0.5;
          stars.rotation.y += 0.0005;
          stars.rotation.x += 0.0002;
          brainGroup.rotation.y += 0.001;
        }
        controls.update();
        renderer.render(scene, camera);
      }

      function onWindowResize() {
        const panel = document.getElementById("clinical-panel");
        const width = panel.classList.contains("open")
          ? window.innerWidth * 0.65
          : window.innerWidth;
        camera.aspect = width / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(width, window.innerHeight);
      }
      window.addEventListener("resize", onWindowResize);
      onWindowResize();
      animate();
    </script>
  </body>
</html>
